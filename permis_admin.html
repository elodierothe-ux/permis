<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Permis à points — Administration</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#eeece6;--card:#ffffff;--surface:#f5f5f3;
  --text:#1a1a18;--sub:#6b6b68;--hint:#9b9b98;
  --info-bg:#e6f1fb;--info:#185fa5;--info-border:#b5d4f4;
  --danger-bg:#fcebeb;--danger:#791f1f;--danger-border:#f7c1c1;
  --border:rgba(0,0,0,0.15);--border-md:rgba(0,0,0,0.3);
  --radius:8px;--radius-lg:12px;--font:system-ui,-apple-system,sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#333331;--card:#1e1e1c;--surface:#2a2a28;
  --text:#f0ede6;--sub:#a0a09d;--hint:#6b6b68;
  --info-bg:#0c447c;--info:#85b7eb;--info-border:#185fa5;
  --danger-bg:#501313;--danger:#f09595;--danger-border:#a32d2d;
  --border:rgba(255,255,255,0.15);--border-md:rgba(255,255,255,0.3);
}}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:1rem;}
.container{width:100%;max-width:600px;padding:0.5rem 0 3rem;}
#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:1rem;}
#main{display:none;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--info);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.header{display:flex;align-items:center;justify-content:space-between;padding:1.5rem 0 1.25rem;}
.header-left{display:flex;align-items:center;gap:12px;}
.header-icon{width:44px;height:44px;border-radius:50%;background:var(--info-bg);display:flex;align-items:center;justify-content:center;}
.header-icon i{font-size:22px;color:var(--info);}
.header-title{font-size:18px;font-weight:500;}
.header-sub{font-size:13px;color:var(--sub);}
.btn{padding:9px 18px;border-radius:var(--radius);border:0.5px solid var(--border-md);background:transparent;cursor:pointer;font-size:14px;font-family:var(--font);color:var(--text);}
.btn-primary{background:var(--info-bg);color:var(--info);border-color:var(--info-border);font-weight:500;}
.btn:hover{opacity:0.85;}
.card{background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:1rem;}
.prof-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:0.5px solid var(--border);gap:12px;}
.prof-row:last-child{border-bottom:none;}
.prof-info{flex:1;min-width:0;}
.prof-nom{font-size:15px;font-weight:500;display:block;margin-bottom:3px;}
.prof-classes{font-size:12px;color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.badge-principal{display:inline-flex;align-items:center;gap:4px;background:var(--info-bg);color:var(--info);border-radius:99px;padding:2px 9px;font-size:11px;font-weight:500;margin-top:4px;}
.prof-actions{display:flex;gap:6px;flex-shrink:0;}
.btn-icon{width:34px;height:34px;border-radius:var(--radius);border:0.5px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--sub);}
.btn-icon:hover{background:var(--surface);color:var(--text);}
.btn-icon.danger:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border);}
.btn-icon i{font-size:16px;}
.empty{font-size:13px;color:var(--sub);padding:1.5rem 0;text-align:center;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:50;align-items:center;justify-content:center;padding:1rem;}
.modal{background:var(--card);border-radius:var(--radius-lg);padding:1.5rem;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;}
.modal-header h2{font-size:17px;font-weight:500;}
.close-btn{background:none;border:none;cursor:pointer;color:var(--sub);padding:4px;font-size:20px;}
label{font-size:13px;color:var(--sub);display:block;margin-bottom:4px;margin-top:14px;}
input[type=text]{width:100%;padding:9px 11px;border:0.5px solid var(--border-md);border-radius:var(--radius);font-family:var(--font);font-size:14px;background:var(--card);color:var(--text);outline:none;}
input[type=text]:focus{border-color:var(--info);}
.classes-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;}
.classe-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border:0.5px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:13px;color:var(--text);}
.classe-item:hover{border-color:var(--border-md);}
.classe-item input{width:16px;height:16px;cursor:pointer;flex-shrink:0;accent-color:var(--info);}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1.5rem;}
.qr-modal-content{background:var(--card);border-radius:var(--radius-lg);padding:1.5rem;width:100%;max-width:360px;text-align:center;}
.qr-modal-content h2{font-size:17px;font-weight:500;margin-bottom:4px;}
.qr-sub{font-size:13px;color:var(--sub);margin-bottom:1.25rem;}
.qr-box{background:#fff;border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1rem;display:inline-block;margin-bottom:1rem;}
.qr-url-display{background:var(--surface);border-radius:var(--radius);padding:8px 12px;font-size:11px;color:var(--hint);word-break:break-all;margin-bottom:1.25rem;}
.qr-footer-btns{display:flex;gap:8px;justify-content:center;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:0.5px solid var(--border-md);border-radius:var(--radius);padding:10px 20px;font-size:14px;font-weight:500;display:none;z-index:99;box-shadow:0 2px 12px rgba(0,0,0,0.1);}
.tabs{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;}
.tab{padding:8px 14px;border-radius:var(--radius);border:0.5px solid var(--border-md);background:transparent;color:var(--sub);cursor:pointer;font-size:13px;font-family:var(--font);}
.tab.active{background:var(--surface);color:var(--text);font-weight:500;border-color:var(--border-md);}
.app-section{display:none;}
.app-section.visible{display:block;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.metric{background:var(--surface);border-radius:var(--radius);padding:1rem;}
.metric .val{font-size:24px;font-weight:500;}
.metric .lbl{font-size:13px;color:var(--sub);margin-top:2px;}
.points-badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:500;flex-shrink:0;}
.pts-ok{background:#EAF3DE;color:#27500A;}
.pts-warn{background:#FAEEDA;color:#633806;}
.pts-danger{background:#FCEBEB;color:#791F1F;}
.eleve-row,.hist-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:0.5px solid var(--border);font-size:14px;gap:8px;}
.hist-row{font-size:13px;}
.eleve-row:last-child,.hist-row:last-child{border-bottom:none;}
.plus{color:#27500A;font-weight:500;}
.minus{color:#791F1F;font-weight:500;}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface);color:var(--sub);margin-left:4px;}
.search-row{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;}
.search-row input,.search-row select{flex:1;min-width:120px;}
select{padding:9px 11px;border:0.5px solid var(--border-md);border-radius:var(--radius);font-family:var(--font);font-size:14px;background:var(--card);color:var(--text);outline:none;}
@media print{.modal-overlay,.toast,.btn-primary{display:none!important;}}
</style>
</head>
<body>
<div class="container">
  <div id="loading"><div class="spinner"></div><p style="font-size:14px;color:var(--sub);">Connexion...</p></div>
  <div id="main">
    <div class="header">
      <div class="header-left">
        <div class="header-icon"><i class="ti ti-shield"></i></div>
        <div><div class="header-title">Administration</div><div class="header-sub">Gestion des enseignants</div></div>
      </div>
      <button class="btn btn-primary" onclick="ouvrirFormulaire(null)"><i class="ti ti-plus"></i> Ajouter un prof</button>
    </div>
    <div class="tabs">
      <button class="tab active" id="tab-btn-profs" onclick="showAdminTab('profs',this)"><i class="ti ti-users"></i> Enseignants</button>
      <button class="tab" id="tab-btn-suivi" onclick="showAdminTab('suivi',this)"><i class="ti ti-chart-bar"></i> Suivi des points</button>
    </div>
    <div class="app-section visible" id="admintab-profs">
      <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <div>
          <p style="font-size:14px;font-weight:500;">Import initial</p>
          <p style="font-size:12px;color:var(--sub);">Ajoute les 27 professeurs connus, sans doublon.</p>
        </div>
        <button class="btn" onclick="importerProfsDefaut()"><i class="ti ti-download"></i> Importer</button>
      </div>
      <div class="card">
        <p style="font-size:15px;font-weight:500;margin-bottom:1rem;">Enseignants</p>
        <div id="profs-liste"></div>
      </div>
    </div>
    <div class="app-section" id="admintab-suivi">
      <div class="grid2" style="margin-bottom:1rem;">
        <div class="metric"><div class="val" id="s-nb-eleves">0</div><div class="lbl">Élèves suivis</div></div>
        <div class="metric"><div class="val" id="s-nb-modifs">0</div><div class="lbl">Modifications</div></div>
      </div>
      <div class="card">
        <p style="font-size:15px;font-weight:500;margin-bottom:0.75rem;">Tous les élèves</p>
        <div class="search-row">
          <input type="text" id="s-search" placeholder="Rechercher un élève..." oninput="renderSuivi()"/>
          <select id="s-filtre-classe" onchange="renderSuivi()"><option value="">Toutes les classes</option></select>
        </div>
        <div id="s-liste-eleves"></div>
      </div>
      <div class="card">
        <p style="font-size:15px;font-weight:500;margin-bottom:0.75rem;">Historique des points retirés / ajoutés</p>
        <div class="search-row">
          <select id="s-filtre-classe-h" onchange="renderSuivi()"><option value="">Toutes les classes</option></select>
          <select id="s-filtre-prof" onchange="renderSuivi()"><option value="">Tous les profs</option></select>
        </div>
        <div id="s-historique"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)fermerModal()">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-titre">Ajouter un prof</h2>
      <button class="close-btn" onclick="fermerModal()"><i class="ti ti-x"></i></button>
    </div>
    <label>Civilité</label>
    <select id="f-civ">
      <option value="M.">M.</option>
      <option value="Mme">Mme</option>
    </select>
    <label>Nom du professeur</label>
    <input type="text" id="f-nom" placeholder="Ex : Dupont Marie"/>
    <label>Classes assignées <span style="color:var(--hint);font-weight:400;">(optionnel)</span></label>
    <div class="classes-grid" id="classes-grid">
      <label class="classe-item"><input type="checkbox" class="classe-cb" value="1 ELEC"/> 1 ELEC</label>
      <label class="classe-item"><input type="checkbox" class="classe-cb" value="1 METAL"/> 1 METAL</label>
      <label class="classe-item"><input type="checkbox" class="classe-cb" value="1 MSPC"/> 1 MSPC</label>
      <label class="classe-item"><input type="checkbox" class="classe-cb" value="1 TRPM"/> 1 TRPM</label>
      <label class="classe-item"><input type="checkbox" class="classe-cb" value="2DE MSPC"/> 2DE MSPC</label>
      <label class="classe-item"><input type="checkbox" class="classe-cb" value="2DE TRPM"/> 2DE TRPM</label>
      <label class="classe-item"><input type="checkbox" class="classe-cb" value="3 PM BY"/> 3 PM BY</label>
      <label class="classe-item"><input type="checkbox" class="classe-cb" value="T ELEC"/> T ELEC</label>
      <label class="classe-item"><input type="checkbox" class="classe-cb" value="T METAL"/> T METAL</label>
      <label class="classe-item"><input type="checkbox" class="classe-cb" value="T MSPC"/> T MSPC</label>
      <label class="classe-item"><input type="checkbox" class="classe-cb" value="T TRPM"/> T TRPM</label>
    </div>
    <label>Professeur principal <span style="color:var(--hint);font-weight:400;">(optionnel)</span></label>
    <select id="f-principal"><option value="">-- Aucune --</option></select>
    <div class="modal-footer">
      <button class="btn" onclick="fermerModal()">Annuler</button>
      <button class="btn btn-primary" onclick="sauvegarderProf()"><i class="ti ti-check"></i> Sauvegarder</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="qr-modal" onclick="if(event.target===this)fermerQR()">
  <div class="qr-modal-content">
    <div style="display:flex;justify-content:flex-end;margin-bottom:0.75rem;">
      <button class="close-btn" onclick="fermerQR()"><i class="ti ti-x"></i></button>
    </div>
    <h2 id="qr-nom"></h2>
    <p class="qr-sub" id="qr-classes"></p>
    <div class="qr-box"><div id="qr-display"></div></div>
    <div class="qr-url-display" id="qr-url"></div>
    <div class="qr-footer-btns">
      <button class="btn" onclick="fermerQR()">Fermer</button>
      <button class="btn btn-primary" onclick="window.print()"><i class="ti ti-printer"></i> Imprimer</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="detail-modal" onclick="if(event.target===this)fermerDetail()">
  <div class="modal">
    <div class="modal-header">
      <h2 id="detail-nom"></h2>
      <button class="close-btn" onclick="fermerDetail()"><i class="ti ti-x"></i></button>
    </div>
    <p style="font-size:13px;color:var(--sub);margin-bottom:0.75rem;" id="detail-sub"></p>
    <div id="detail-liste"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyCASbhHGaj_HbXYte2rbIIiYBsZ8r3y4B0",
  authDomain: "permis-a-points.firebaseapp.com",
  databaseURL: "https://permis-a-points-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "permis-a-points",
  storageBucket: "permis-a-points.firebasestorage.app",
  messagingSenderId: "914342780439",
  appId: "1:914342780439:web:58517c3a49d4dca81a0652"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var BASE_URL = 'https://ancient-bread-4dc9.elodierothe.workers.dev/permis_prof_elo.html';
var profs = {};
var editingId = null;
var eleves = {};
var historique = [];
var ALL_CLASSES = [
  "1 ELEC","1 METAL","1 MSPC","1 TRPM",
  "2DE MSPC","2DE TRPM",
  "3 PM BY",
  "T ELEC","T METAL","T MSPC","T TRPM"
];

var TEACHERS_SEED = [
  {civ:'M.',nom:'Georgin'},{civ:'M.',nom:'Ring'},{civ:'M.',nom:'Cherkaoui'},{civ:'M.',nom:'Igel'},
  {civ:'M.',nom:'Schutz'},{civ:'M.',nom:'Loutre'},{civ:'M.',nom:'Mayer'},{civ:'M.',nom:'Kasprask'},
  {civ:'M.',nom:'Kedinger'},{civ:'M.',nom:'Braun'},{civ:'M.',nom:'Jegou'},{civ:'M.',nom:'Di Maria'},
  {civ:'M.',nom:'Michel'},{civ:'M.',nom:'Dogat-Dudek'},{civ:'M.',nom:'Bellavia'},{civ:'M.',nom:'Pilorge'},
  {civ:'M.',nom:'Jungmann'},{civ:'M.',nom:'Chuberre'},
  {civ:'Mme',nom:'Schneider'},{civ:'Mme',nom:'Communale'},{civ:'Mme',nom:'Rothe'},{civ:'Mme',nom:'Dodeller'},
  {civ:'Mme',nom:'Amsinger'},{civ:'Mme',nom:'Megel'},{civ:'Mme',nom:'Hemdani'},{civ:'Mme',nom:'Dave'},
  {civ:'Mme',nom:'Steiner'}
];

function importerProfsDefaut() {
  var existants = Object.values(profs).map(function(p){ return p.nom.toLowerCase(); });
  var updates = {};
  var count = 0;
  TEACHERS_SEED.forEach(function(p){
    if(existants.indexOf(p.nom.toLowerCase()) === -1){
      var id = genProfId(p.nom);
      updates['profs/'+id] = { nom: p.nom, civ: p.civ, classes: [], principal: '', id: id };
      count++;
    }
  });
  if(count===0){ showToast('Tous les professeurs sont déjà présents.'); return; }
  db.ref().update(updates).then(function(){
    showToast(count+' professeur(s) importé(s) !');
  });
}

function genProfId(nom) {
  return nom.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'') + '-' + Date.now().toString(36);
}

function showLoading(on) {
  document.getElementById('loading').style.display = on ? 'flex' : 'none';
  document.getElementById('main').style.display = on ? 'none' : 'block';
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(function(){ t.style.display='none'; }, 3000);
}

function renderProfsList() {
  var liste = document.getElementById('profs-liste');
  var all = Object.values(profs).sort(function(a,b){ return a.nom.localeCompare(b.nom); });
  if(!all.length) {
    liste.innerHTML = '<p class="empty">Aucun prof. Cliquez sur "Ajouter un prof".</p>';
    return;
  }
  liste.innerHTML = '';
  all.forEach(function(p) {
    var div = document.createElement('div');
    div.className = 'prof-row';
    var civNom = (p.civ||'M.') + ' ' + p.nom;
    var classesHtml = (p.classes && p.classes.length ? p.classes.join(' · ') : '<em style="color:var(--hint)">Aucune classe assignée</em>');
    var principalHtml = p.principal ? '<span class="badge-principal"><i class="ti ti-star"></i> Prof. principal — '+p.principal+'</span>' : '';
    div.innerHTML = '<div class="prof-info"><span class="prof-nom">'+civNom+'</span><span class="prof-classes">'+classesHtml+'</span>'+principalHtml+'</div><div class="prof-actions"><button class="btn-icon" onclick="afficherQR(\''+p.id+'\')" title="QR code"><i class="ti ti-qrcode"></i></button><button class="btn-icon" onclick="ouvrirFormulaire(\''+p.id+'\')" title="Modifier"><i class="ti ti-edit"></i></button><button class="btn-icon danger" onclick="supprimerProf(\''+p.id+'\')" title="Supprimer"><i class="ti ti-trash"></i></button></div>';
    liste.appendChild(div);
  });
}

function updatePrincipalOptions() {
  var checked = Array.from(document.querySelectorAll('.classe-cb:checked')).map(function(cb){ return cb.value; });
  var sel = document.getElementById('f-principal');
  var prev = sel.value;
  sel.innerHTML = '<option value="">-- Aucune --</option>';
  checked.forEach(function(c){
    var o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o);
  });
  if (checked.indexOf(prev) >= 0) sel.value = prev;
}
document.getElementById('classes-grid').addEventListener('change', updatePrincipalOptions);

function ouvrirFormulaire(id) {
  editingId = id || null;
  document.querySelectorAll('.classe-cb').forEach(function(cb){ cb.checked = false; });
  if(id && profs[id]) {
    document.getElementById('modal-titre').textContent = 'Modifier le prof';
    document.getElementById('f-civ').value = profs[id].civ || 'M.';
    document.getElementById('f-nom').value = profs[id].nom;
    (profs[id].classes||[]).forEach(function(c){
      var cb = document.querySelector('.classe-cb[value="'+c+'"]');
      if(cb) cb.checked = true;
    });
    updatePrincipalOptions();
    document.getElementById('f-principal').value = profs[id].principal || '';
  } else {
    document.getElementById('modal-titre').textContent = 'Ajouter un prof';
    document.getElementById('f-civ').value = 'M.';
    document.getElementById('f-nom').value = '';
    updatePrincipalOptions();
  }
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('f-nom').focus();
}

function fermerModal() {
  document.getElementById('modal').style.display = 'none';
  editingId = null;
}

function sauvegarderProf() {
  var civ = document.getElementById('f-civ').value;
  var nom = document.getElementById('f-nom').value.trim();
  if(!nom) { showToast('Entrez un nom.'); return; }
  var classes = Array.from(document.querySelectorAll('.classe-cb:checked')).map(function(cb){ return cb.value; });
  var principal = document.getElementById('f-principal').value;
  var id = editingId || genProfId(nom);
  db.ref('profs/'+id).set({ nom: nom, civ: civ, classes: classes, principal: principal, id: id }).then(function(){
    fermerModal();
    showToast(editingId ? nom+' mis à jour !' : nom+' ajouté !');
  });
}

function supprimerProf(id) {
  if(!profs[id]) return;
  if(!confirm('Supprimer '+profs[id].nom+' ?')) return;
  db.ref('profs/'+id).remove().then(function(){
    showToast('Prof supprimé.');
  });
}

function showAdminTab(id, el) {
  document.querySelectorAll('.app-section').forEach(function(s){ s.classList.remove('visible'); });
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  document.getElementById('admintab-'+id).classList.add('visible');
  el.classList.add('active');
  if(id==='suivi') renderSuivi();
}

function refreshSuiviFiltres() {
  ['s-filtre-classe','s-filtre-classe-h'].forEach(function(id){
    var sel = document.getElementById(id);
    var prev = sel.value;
    sel.innerHTML = '<option value="">Toutes les classes</option>';
    ALL_CLASSES.forEach(function(c){ var o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o); });
    if(prev) sel.value = prev;
  });
  var selProf = document.getElementById('s-filtre-prof');
  var prevProf = selProf.value;
  selProf.innerHTML = '<option value="">Tous les profs</option>';
  Object.values(profs).sort(function(a,b){ return a.nom.localeCompare(b.nom); }).forEach(function(p){
    var label = (p.civ||'M.')+' '+p.nom;
    var o=document.createElement('option'); o.value=label; o.textContent=label; selProf.appendChild(o);
  });
  if(prevProf) selProf.value = prevProf;
}

function renderSuivi() {
  var search = (document.getElementById('s-search')||{}).value || '';
  search = search.toLowerCase();
  var filtreClasse = (document.getElementById('s-filtre-classe')||{}).value || '';
  var liste = Object.values(eleves).filter(function(e){
    return (!filtreClasse||e.classe===filtreClasse) && (!search||e.nom.toLowerCase().indexOf(search)>=0);
  }).sort(function(a,b){ return a.points-b.points; });
  document.getElementById('s-nb-eleves').textContent = Object.keys(eleves).length;
  document.getElementById('s-nb-modifs').textContent = historique.length;
  var el = document.getElementById('s-liste-eleves');
  el.innerHTML = liste.length ? '' : '<p class="empty">Aucun élève trouvé.</p>';
  liste.forEach(function(e){
    var cls = e.points>=20?'pts-ok':e.points>=10?'pts-warn':'pts-danger';
    var div = document.createElement('div'); div.className='eleve-row';
    div.innerHTML = '<div style="cursor:pointer;" onclick="voirDetail(\''+e.code+'\')"><span style="font-weight:500;">'+e.nom+'</span><br><span style="font-size:12px;color:var(--sub);">'+e.classe+'</span></div><span class="points-badge '+cls+'">'+e.points+' pts</span>';
    el.appendChild(div);
  });
  var filtreClasseH = (document.getElementById('s-filtre-classe-h')||{}).value || '';
  var filtreProf = (document.getElementById('s-filtre-prof')||{}).value || '';
  var histFilt = historique.filter(function(h){
    return (!filtreClasseH||h.classe===filtreClasseH) && (!filtreProf||h.prof===filtreProf);
  });
  var hist = document.getElementById('s-historique');
  hist.innerHTML = histFilt.length ? '' : '<p class="empty">Aucune modification pour le moment.</p>';
  histFilt.slice(0,50).forEach(function(h){
    var d = document.createElement('div'); d.className='hist-row';
    d.innerHTML = '<div><span style="font-weight:500;">'+h.nom+'</span><span class="tag">'+h.classe+'</span>'+(h.prof?'<span class="tag">'+h.prof+'</span>':'')+'<br><span style="color:var(--sub);">'+h.motif+'</span></div><div style="text-align:right;"><span class="'+(h.delta>0?'plus':'minus')+'">'+(h.delta>0?'+':'')+h.delta+' pts</span><br><span style="font-size:11px;color:var(--sub);">'+h.date+'</span></div>';
    hist.appendChild(d);
  });
}

function voirDetail(code) {
  var e = eleves[code];
  if(!e) return;
  document.getElementById('detail-nom').textContent = e.nom;
  document.getElementById('detail-sub').textContent = e.classe+' — '+e.points+' pts actuellement';
  var hist = historique.filter(function(h){ return h.code===code || (!h.code && h.nom===e.nom && h.classe===e.classe); });
  var el = document.getElementById('detail-liste');
  el.innerHTML = hist.length ? '' : '<p class="empty">Aucun historique pour cet élève.</p>';
  hist.forEach(function(h){
    var d = document.createElement('div'); d.className='hist-row';
    d.innerHTML = '<div>'+(h.prof?'<span class="tag">'+h.prof+'</span>':'')+'<br><span style="color:var(--sub);">'+h.motif+'</span></div><div style="text-align:right;"><span class="'+(h.delta>0?'plus':'minus')+'">'+(h.delta>0?'+':'')+h.delta+' pts</span><br><span style="font-size:11px;color:var(--sub);">'+h.date+'</span></div>';
    el.appendChild(d);
  });
  document.getElementById('detail-modal').style.display = 'flex';
}

function fermerDetail() {
  document.getElementById('detail-modal').style.display = 'none';
}

function afficherQR(id) {
  var prof = profs[id];
  if(!prof) return;
  var url = BASE_URL + '?prof=' + encodeURIComponent(id);
  document.getElementById('qr-nom').textContent = (prof.civ||'M.') + ' ' + prof.nom;
  document.getElementById('qr-classes').textContent = prof.classes && prof.classes.length ? prof.classes.join(', ') : 'Aucune classe assignée';
  document.getElementById('qr-url').textContent = url;
  var container = document.getElementById('qr-display');
  container.innerHTML = '';
  new QRCode(container, { text: url, width: 200, height: 200, colorDark:'#1a1a18', colorLight:'#ffffff' });
  document.getElementById('qr-modal').style.display = 'flex';
}

function fermerQR() {
  document.getElementById('qr-modal').style.display = 'none';
}

// Init
showLoading(true);
db.ref('profs').on('value', function(snap){
  profs = snap.val() || {};
  showLoading(false);
  renderProfsList();
  refreshSuiviFiltres();
});

db.ref('eleves').on('value', function(snap){
  eleves = snap.val() || {};
  renderSuivi();
});

db.ref('historique').on('value', function(snap){
  historique = snap.exists() ? Object.values(snap.val()) : [];
  historique.sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
  renderSuivi();
});
</script>
</body>
</html>
